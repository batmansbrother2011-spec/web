<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .score {
    font-size: 2rem;
    margin-bottom: 1rem;
    font-weight: bold;
    color: #4ade80;
  }
  canvas {
    background: #0f0f1e;
    border: 2px solid #4ade80;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
    touch-action: none;
  }
  .controls {
    margin-top: 1rem;
    text-align: center;
    color: #94a3b8;
    font-size: 0.9rem;
  }
  .restart {
    margin-top: 1rem;
    padding: 0.5rem 1.5rem;
    background: #4ade80;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    display: none;
  }
  .restart.show { display: inline-block; }
  .touch-controls {
    display: none;
    margin-top: 1rem;
    grid-template-areas: ". up ." "left . right" ". down .";
    gap: 0.5rem;
  }
  .touch-controls button {
    width: 60px; height: 60px;
    font-size: 1.5rem;
    border: 2px solid #4ade80;
    background: rgba(74, 222, 128, 0.1);
    color: #4ade80;
    border-radius: 8px;
    cursor: pointer;
  }
  .touch-controls button:active { background: rgba(74, 222, 128, 0.3); }
  .btn-up { grid-area: up; } .btn-down { grid-area: down; }
  .btn-left { grid-area: left; } .btn-right { grid-area: right; }
  @media (pointer: coarse) { .touch-controls { display: grid; } }
</style>
</head>
<body>
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <button class="restart" id="restart" onclick="restart()">Play Again</button>
  <div class="controls">
    <p>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move</p>
  </div>
  <div class="touch-controls">
    <button class="btn-up" onclick="setDir(0,-1)">▲</button>
    <button class="btn-left" onclick="setDir(-1,0)">◀</button>
    <button class="btn-right" onclick="setDir(1,0)">▶</button>
    <button class="btn-down" onclick="setDir(0,1)">▼</button>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const restartBtn = document.getElementById('restart');
const GRID = 20;
const TILE = canvas.width / GRID;
let snake, dir, nextDir, food, score, gameLoop, speed;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 120;
  placeFood();
  scoreEl.textContent = '0';
  restartBtn.classList.remove('show');
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;
  if (dir.x === x && dir.y === y) return;
  nextDir = {x, y};
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (score % 50 === 0) {
      speed = Math.max(60, speed - 10);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x * TILE + TILE/2, food.y * TILE + TILE/2, TILE/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    const alpha = 1 - (i / snake.length) * 0.5;
    ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74, 222, 128, ${alpha})`;
    ctx.fillRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2);
  });
}

function gameOver() {
  clearInterval(gameLoop);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f87171';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
  restartBtn.classList.add('show');
}

function restart() { init(); }

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
  }
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
}, {passive: true});

init();
</script>
</body>
</html>
